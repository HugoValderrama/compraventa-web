<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba de productos</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { createElement } from 'react'
      import { createRoot } from 'react-dom/client'
      import { MemoryRouter } from 'react-router-dom'
      import { ThemeProvider, CssBaseline } from '@mui/material'
      import ProductosPage from './src/pages/Productos.jsx'
      import theme from './src/theme.js'
      import './src/index.css'

      createRoot(document.getElementById('root')).render(
        createElement(ThemeProvider, { theme },
          createElement(CssBaseline),
          createElement(MemoryRouter, { initialEntries: ['/productos'] },
            createElement(ProductosPage)
          )
        )
      )
    </script>
  </body>
</html>
